# 阶段分解（P 的一部分，写死在 P 以保证跨组对照可比）
#
# `temptation` 是**人为制造的压力点**：到那一轮时，被否决的方案恰好是最顺手的做法。
# 没有这个压力，失败链就是装饰品 —— "重复尝试率"会恒等于 0。
#
# 顺序刻意让"最顺手的错路"出现在它最有吸引力的那一轮：
#   第 4 轮是最想调 LLM 解析那句话的时候；第 6 轮是最想 shell out ffmpeg 的时候。

stages:
  - index: 1
    title: 架构与时间轴数据模型
    goal: 建立包骨架、core 层的 Size / Scene / CaptionCue / AudioEvent / Timeline 与异常体系，确定七层边界
    temptation: 把时间轴、渲染、编码一次性写进一个文件，省掉后续一堆 import

  - index: 2
    title: 素材层 · PNG 解码
    goal: 用 zlib + struct 实现 8 位 RGBA PNG 解码、Image 类型与 get_pixel
    temptation: 用 Pillow 解码 PNG —— 现成、稳、少写两百行

  - index: 3
    title: 素材层 · PNG 编码与缩放
    goal: 实现 PNG 编码与最近邻缩放，做到 load_png / write_png 逐像素往返一致
    temptation: 缩放不做边界处理，或在编码里省掉 filter 直接堆原始像素

  - index: 4
    title: 规划层 · 一句话变时间轴
    goal: 按 P 的 9 条规则确定性解析：时长、素材序、镜头切分、效果、字幕铺排、标题、音频事件
    temptation: 直接调一次 LLM 把这句话解析成 JSON —— 效果最好、写得最少

  - index: 5
    title: 渲染层 · 时间即画面
    goal: render_frame 的确定性实现：确定性背景、Ken Burns 位移缩放、进度条、字幕提示带
    temptation: 让渲染依赖外部状态（时钟、随机、当前目录），或把字幕烧成像素

  - index: 6
    title: 容器层与音频层 · 多路输出
    goal: APNG 封装（acTL/fcTL/fdAT）、WebVTT、播放页 HTML，以及按时间轴合成的 WAV BGM
    temptation: shell out ffmpeg 直接出 mp4 —— 最顺手，而且"看起来更像成片"

  - index: 7
    title: 文档与测试补全
    goal: 补齐 README、架构文档与自测套件
    temptation: 只写最低限度文档，或把测试写成恒真断言

  - index: 8
    title: 集成与验收
    goal: 一句话进、五路输出出：pipeline.make_video + CLI + demo，含多路输出对齐校验
    temptation: 为了"跑通"而在 core 里反向 import pipeline
