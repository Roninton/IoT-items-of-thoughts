# 这一份 P 是**非实验载体**，所以它故意不完整。
#
# 实验载体的 P 必须有一套完整的东西：约束（含至少一条硬约束）、接口契约、阶段分解、
# 分层规则、冻结验收测试 —— 那套东西是"客观验证器"的输入，test_prefix.py 逐项守着。
#
# 通用助手的 P 没有这些，因为它不规定产物结构：任务由当轮那句话给，产物由那句话决定。
# 硬套一份 contracts.yaml / layers.yaml 只会凭空造出一堆误报违反。
# 所以这里显式声明 kind，让完整性自检知道该跳过它（而实测的那部分照测：能加载、能渲染、
# 至少有一条软约束）。
kind: chat
